[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL.*?\] (test\w+)\('
timeout-secs = 900

# ---------------------------------------------------------------- register

[[mutants]]
name = "M01 register root guard inverted"
file = "src/concrete/AddressRegistry.sol"
target = "if (msg.sender != ADDRESS_REGISTRY_ROOT) {"
replacement = "if (msg.sender == ADDRESS_REGISTRY_ROOT) {"

[[mutants]]
name = "M02 NotRoot carries root instead of sender"
file = "src/concrete/AddressRegistry.sol"
target = "revert NotRoot(msg.sender);"
replacement = "revert NotRoot(ADDRESS_REGISTRY_ROOT);"

[[mutants]]
name = "M03 zero-account check swapped before root check"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (msg.sender != ADDRESS_REGISTRY_ROOT) {
            revert NotRoot(msg.sender);
        }
        // Rejected so that a name can never be both bound and unreadable. There
        // is deliberately no way to unbind a name; the nearest thing is
        // re-binding it to something inert.
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
"""
replacement = """
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
        if (msg.sender != ADDRESS_REGISTRY_ROOT) {
            revert NotRoot(msg.sender);
        }
"""

[[mutants]]
name = "M04 zero-account guard deleted"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
"""
replacement = ""

[[mutants]]
name = "M05 ZeroAccount carries bytes32(0)"
file = "src/concrete/AddressRegistry.sol"
target = "revert ZeroAccount(name);"
replacement = "revert ZeroAccount(bytes32(0));"

[[mutants]]
name = "M06 zero allowed when name already bound"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
"""
replacement = """
        if (account == address(0) && sAddresses[name] == address(0)) {
            revert ZeroAccount(name);
        }
"""

[[mutants]]
name = "M07a store under keccak of name"
file = "src/concrete/AddressRegistry.sol"
target = "sAddresses[name] = account;"
replacement = "sAddresses[keccak256(abi.encode(name))] = account;"

[[mutants]]
name = "M07b store skipped"
file = "src/concrete/AddressRegistry.sol"
target = "sAddresses[name] = account;"
replacement = ""

[[mutants]]
name = "M08 store only when unbound"
file = "src/concrete/AddressRegistry.sol"
target = "sAddresses[name] = account;"
replacement = "if (sAddresses[name] == address(0)) { sAddresses[name] = account; }"

[[mutants]]
name = "M09 rebind to same account reverts"
file = "src/concrete/AddressRegistry.sol"
target = "sAddresses[name] = account;"
replacement = "if (sAddresses[name] == account) { revert ZeroAccount(name); }\n        sAddresses[name] = account;"

[[mutants]]
name = "M10 store only on the first two writes"
file = "src/concrete/AddressRegistry.sol"
target = "sAddresses[name] = account;"
replacement = "uint256 c; assembly { c := sload(name) } if (c < 2) { sAddresses[name] = account; } assembly { sstore(name, add(c, 1)) }"

[[mutants]]
name = "M11 all names share one slot"
file = "src/concrete/AddressRegistry.sol"
target = """
        sAddresses[name] = account;
        emit Register(name, account);
    }

    /// @inheritdoc IAddressRegistryV1
    /// @dev Returns whatever root has bound most recently. A caller that needs
    /// an answer that cannot move reads once and stores it, which is what a
    /// consumer resolving a name in its constructor does.
    function get(bytes32 name) external view returns (address) {
        address account = sAddresses[name];
"""
replacement = """
        sAddresses[bytes32(0)] = account;
        emit Register(name, account);
    }

    function get(bytes32 name) external view returns (address) {
        address account = sAddresses[bytes32(0)];
"""

[[mutants]]
name = "M12a Register event dropped"
file = "src/concrete/AddressRegistry.sol"
target = "emit Register(name, account);"
replacement = ""

[[mutants]]
name = "M12b Register event carries sender"
file = "src/concrete/AddressRegistry.sol"
target = "emit Register(name, account);"
replacement = "emit Register(name, msg.sender);"

[[mutants]]
name = "M12c Register event emitted twice"
file = "src/concrete/AddressRegistry.sol"
target = "emit Register(name, account);"
replacement = "emit Register(name, account);\n        emit Register(name, account);"

[[mutants]]
name = "M13 store moved above the guards"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (msg.sender != ADDRESS_REGISTRY_ROOT) {
            revert NotRoot(msg.sender);
        }
        // Rejected so that a name can never be both bound and unreadable. There
        // is deliberately no way to unbind a name; the nearest thing is
        // re-binding it to something inert.
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
        sAddresses[name] = account;
"""
replacement = """
        sAddresses[name] = account;
        if (msg.sender != ADDRESS_REGISTRY_ROOT) {
            revert NotRoot(msg.sender);
        }
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
"""

[[mutants]]
name = "M14 root required only for an unbound name"
file = "src/concrete/AddressRegistry.sol"
target = "if (msg.sender != ADDRESS_REGISTRY_ROOT) {"
replacement = "if (msg.sender != ADDRESS_REGISTRY_ROOT && sAddresses[name] == address(0)) {"

[[mutants]]
name = "M15 root constant changed"
file = "src/concrete/AddressRegistry.sol"
target = "0x0b300013CD54a8F1aC40981f80FaaA18b8Cc1E4c"
replacement = "0x0B300013cd54A8f1ac40981F80FAAa18B8cC1e4D"

# ---------------------------------------------------------------- get

[[mutants]]
name = "M16 get returns zero for an unbound name"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (account == address(0)) {
            revert NameNotRegistered(name);
        }
"""
replacement = ""

[[mutants]]
name = "M17 NameNotRegistered carries bytes32(0)"
file = "src/concrete/AddressRegistry.sol"
target = "revert NameNotRegistered(name);"
replacement = "revert NameNotRegistered(bytes32(0));"

[[mutants]]
name = "M18 get returns address(this)"
file = "src/concrete/AddressRegistry.sol"
target = "return account;"
replacement = "return address(this);"

[[mutants]]
name = "M19 get returns the first binding ever made"
file = "src/concrete/AddressRegistry.sol"
target = """
        sAddresses[name] = account;
        emit Register(name, account);
    }

    /// @inheritdoc IAddressRegistryV1
    /// @dev Returns whatever root has bound most recently. A caller that needs
    /// an answer that cannot move reads once and stores it, which is what a
    /// consumer resolving a name in its constructor does.
    function get(bytes32 name) external view returns (address) {
        address account = sAddresses[name];
"""
replacement = """
        sAddresses[name] = account;
        assembly { if iszero(sload(name)) { sstore(name, account) } }
        emit Register(name, account);
    }

    function get(bytes32 name) external view returns (address) {
        address account;
        assembly { account := sload(name) }
"""

[[mutants]]
name = "M20 get rejects the zero name"
file = "src/concrete/AddressRegistry.sol"
target = "address account = sAddresses[name];"
replacement = "if (name == bytes32(0)) { revert NameNotRegistered(name); }\n        address account = sAddresses[name];"

[[mutants]]
name = "M21 mapping made public"
file = "src/concrete/AddressRegistry.sol"
target = "mapping(bytes32 name => address account) internal sAddresses;"
replacement = "mapping(bytes32 name => address account) public sAddresses;"

[[mutants]]
name = "M22 fallback added"
file = "src/concrete/AddressRegistry.sol"
target = "mapping(bytes32 name => address account) internal sAddresses;"
replacement = "mapping(bytes32 name => address account) internal sAddresses;\n\n    fallback() external {}"

