[[mutants]]
name = "M27 findDeployBlock high starts one below the current block"
file = "src/lib/LibRainDeploy.sol"
target = "        uint256 high = originalBlock;"
replacement = "        uint256 high = originalBlock - 1;"

[[mutants]]
name = "M28 findDeployBlock loop stops one early"
file = "src/lib/LibRainDeploy.sol"
target = "        while (low < high) {"
replacement = "        while (low + 1 < high) {"

[[mutants]]
name = "M29 findDeployBlock mid rounds up"
file = "src/lib/LibRainDeploy.sol"
target = "            uint256 mid = (low + high) / 2;"
replacement = "            uint256 mid = (low + high + 1) / 2;"

[[mutants]]
name = "M30 findDeployBlock drops a matching mid"
file = "src/lib/LibRainDeploy.sol"
target = "                high = mid;"
replacement = "                high = mid - 1;"

[[mutants]]
name = "M31 findDeployBlock keeps a non-matching mid"
file = "src/lib/LibRainDeploy.sol"
target = "                low = mid + 1;"
replacement = "                low = mid;"

