[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL.*\] (test\w+)\('
timeout-secs = 900

[[mutants]]
name = "M01 aggregate drops the address-registry lib"
file = "src/lib/LibReleasedSuites.sol"
target = '''new DeploySuite[][](2);
        released[0] = LibAddressRegistryReleased.releasedSuites();
        released[1] = LibMigrationRegistryReleased.releasedSuites();'''
replacement = '''new DeploySuite[][](1);
        released[0] = LibMigrationRegistryReleased.releasedSuites();'''

