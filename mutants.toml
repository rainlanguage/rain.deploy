target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(keccak256(abi.encode(name)));"

[[mutants]]
name = "M29b resolve returns zero without calling"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "return address(0);"

[[mutants]]
name = "M30 NameNotRegistered swallowed into zero"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "try IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name) returns (address a) { return a; } catch { return address(0); }"

[[mutants]]
name = "M32 creation code changed without changing behaviour"
file = "src/concrete/AddressRegistry.sol"
target = "return account;"
