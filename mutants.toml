replacement = '        return string.concat(tagForRecordPath(vm, path), "_", contractForRecordPath(vm, path));'

[[mutants]]
name = "M75 tagPrecedes compares the first byte as text"
file = "src/lib/LibRainDeploySnapshot.sol"
target = """
            uint256 leftComponent = vm.parseUint(left[i]);
            uint256 rightComponent = vm.parseUint(right[i]);"""
replacement = """
            uint256 leftComponent = uint256(uint8(bytes(left[i])[0]));
            uint256 rightComponent = uint256(uint8(bytes(right[i])[0]));"""

[[mutants]]
name = "M76 tagPrecedes returns greater"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "                return leftComponent < rightComponent;"
replacement = "                return leftComponent > rightComponent;"

[[mutants]]
name = "M77 tagPrecedes stops at an equal component"
file = "src/lib/LibRainDeploySnapshot.sol"
target = """
            if (leftComponent != rightComponent) {
                return leftComponent < rightComponent;
            }"""
replacement = """
            if (leftComponent != rightComponent) {
                return leftComponent < rightComponent;
            }
            return false;"""

[[mutants]]
name = "M78 tagPrecedes skips the major"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        for (uint256 i = 0; i < left.length; i++) {"
replacement = "        for (uint256 i = 1; i < left.length; i++) {"

[[mutants]]
name = "M79 tagPrecedes skips the patch"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        for (uint256 i = 0; i < left.length; i++) {"
replacement = "        for (uint256 i = 0; i < left.length - 1; i++) {"

