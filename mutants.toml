# ---------------------------------------------------------------- extras

[[mutants]]
name = "M33 register rejects the zero name"
file = "src/concrete/AddressRegistry.sol"
target = "revert ZeroAccount(name);"
replacement = "revert ZeroAccount(name);\n        }\n        if (name == bytes32(0)) {\n            revert ZeroAccount(name);"

[[mutants]]
name = "M34 register rejects binding to root itself"
file = "src/concrete/AddressRegistry.sol"
target = """
        if (account == address(0)) {
            revert ZeroAccount(name);
        }
"""
replacement = """
        if (account == address(0) || account == ADDRESS_REGISTRY_ROOT) {
            revert ZeroAccount(name);
        }
"""

