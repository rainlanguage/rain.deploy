[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (test\w+)\('
timeout-secs = 1800

[[mutants]]
name = "M01 derivation is rebuilt from the stored fields"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'DerivedDeploy memory derived = deriveDeployment(suite);'
replacement = 'DerivedDeploy memory derived = DerivedDeploy(suite.suite, suite.storedDeployedAddress, suite.storedBytecodeHash);'

[[mutants]]
name = "M02 stored address check deleted"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'if (suite.storedDeployedAddress != derived.deployedAddress) {'
replacement = 'if (false) {'

[[mutants]]
name = "M03 StoredAddressMismatch args swapped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'revert StoredAddressMismatch(suite.suite, suite.storedDeployedAddress, derived.deployedAddress);'
replacement = 'revert StoredAddressMismatch(suite.suite, derived.deployedAddress, suite.storedDeployedAddress);'

[[mutants]]
name = "M04 stored code hash check deleted"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'if (suite.storedBytecodeHash != derived.bytecodeHash) {'
replacement = 'if (false) {'

[[mutants]]
name = "M05 StoredCodeHashMismatch args swapped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'revert StoredCodeHashMismatch(suite.suite, suite.storedBytecodeHash, derived.bytecodeHash);'
replacement = 'revert StoredCodeHashMismatch(suite.suite, derived.bytecodeHash, suite.storedBytecodeHash);'

[[mutants]]
name = "M06 runtime code hash check deleted"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'if (suite.storedBytecodeHash != runtimeCodeHash) {'
replacement = 'if (false) {'

[[mutants]]
name = "M07 StoredRuntimeCodeHashMismatch args swapped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'revert StoredRuntimeCodeHashMismatch(suite.suite, suite.storedBytecodeHash, runtimeCodeHash);'
replacement = 'revert StoredRuntimeCodeHashMismatch(suite.suite, runtimeCodeHash, suite.storedBytecodeHash);'

[[mutants]]
name = "M08 internal check order reversed"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
        if (suite.storedDeployedAddress != derived.deployedAddress) {
            revert StoredAddressMismatch(suite.suite, suite.storedDeployedAddress, derived.deployedAddress);
        }

        if (suite.storedBytecodeHash != derived.bytecodeHash) {
            revert StoredCodeHashMismatch(suite.suite, suite.storedBytecodeHash, derived.bytecodeHash);
        }

        bytes32 runtimeCodeHash = keccak256(suite.storedRuntimeCode);
        if (suite.storedBytecodeHash != runtimeCodeHash) {
            revert StoredRuntimeCodeHashMismatch(suite.suite, suite.storedBytecodeHash, runtimeCodeHash);
        }
'''
replacement = '''
        bytes32 runtimeCodeHash = keccak256(suite.storedRuntimeCode);
        if (suite.storedBytecodeHash != runtimeCodeHash) {
            revert StoredRuntimeCodeHashMismatch(suite.suite, suite.storedBytecodeHash, runtimeCodeHash);
        }

        if (suite.storedBytecodeHash != derived.bytecodeHash) {
            revert StoredCodeHashMismatch(suite.suite, suite.storedBytecodeHash, derived.bytecodeHash);
        }

        if (suite.storedDeployedAddress != derived.deployedAddress) {
            revert StoredAddressMismatch(suite.suite, suite.storedDeployedAddress, derived.deployedAddress);
        }
'''

[[mutants]]
name = "M09 declaration text drops the type and keyword"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'string constant DEPLOYED_ADDRESS_DECLARATION = "address constant DEPLOYED_ADDRESS =";'
replacement = 'string constant DEPLOYED_ADDRESS_DECLARATION = "DEPLOYED_ADDRESS =";'

[[mutants]]
name = "M10 record split on CRLF"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'string[] memory lines = vm.split(record, "\n");'
replacement = 'string[] memory lines = vm.split(record, "\r\n");'

[[mutants]]
name = "M11 declaration may appear anywhere in the line"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'if (vm.indexOf(lines[i], DEPLOYED_ADDRESS_DECLARATION) != 0) {'
replacement = 'if (vm.indexOf(lines[i], DEPLOYED_ADDRESS_DECLARATION) == type(uint256).max) {'

[[mutants]]
name = "M12 first non-matching line is unreadable"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
                continue;
'''
replacement = '''
                revert FrozenSnapshotUnreadable(path);
'''

[[mutants]]
name = "M13 literal read from a fixed token index"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'string memory literal = tokens[tokens.length - 1];'
replacement = 'string memory literal = tokens[3];'

[[mutants]]
name = "M14 address wrapper not stripped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'
replacement = 'return vm.parseAddress(vm.replace(vm.replace(literal, ")", ""), ";", ""));'

[[mutants]]
name = "M15 closing paren not stripped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'
replacement = 'return vm.parseAddress(vm.replace(vm.replace(literal, "address(", ""), ";", ""));'

[[mutants]]
name = "M16 terminator not stripped"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'
replacement = 'return vm.parseAddress(vm.replace(vm.replace(literal, "address(", ""), ")", ""));'

[[mutants]]
name = "M17 address wrapper is mandatory"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'
replacement = '''
            if (vm.indexOf(literal, "address(") == type(uint256).max) {
                revert FrozenSnapshotUnreadable(path);
            }
            return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'''

[[mutants]]
name = "M18 recorded address is always zero"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));'
replacement = 'return address(0);'

[[mutants]]
name = "M19 last declaration wins instead of the first"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
        string[] memory lines = vm.split(record, "\n");
        for (uint256 i = 0; i < lines.length; i++) {
            if (vm.indexOf(lines[i], DEPLOYED_ADDRESS_DECLARATION) != 0) {
                continue;
            }
            string[] memory tokens = vm.split(lines[i], " ");
            string memory literal = tokens[tokens.length - 1];
            return vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));
        }
        revert FrozenSnapshotUnreadable(path);
'''
replacement = '''
        string[] memory lines = vm.split(record, "\n");
        bool found = false;
        address last = address(0);
        for (uint256 i = 0; i < lines.length; i++) {
            if (vm.indexOf(lines[i], DEPLOYED_ADDRESS_DECLARATION) != 0) {
                continue;
            }
            string[] memory tokens = vm.split(lines[i], " ");
            string memory literal = tokens[tokens.length - 1];
            found = true;
            last = vm.parseAddress(vm.replace(vm.replace(vm.replace(literal, "address(", ""), ")", ""), ";", ""));
        }
        if (found) {
            return last;
        }
        revert FrozenSnapshotUnreadable(path);
'''

[[mutants]]
name = "M20 no declaration returns zero instead of reverting"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
        revert FrozenSnapshotUnreadable(path);
    }
'''
replacement = '''
        return address(0);
    }
'''

[[mutants]]
name = "M21 only the first record file is visited"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'for (uint256 i = 0; i < paths.length; i++) {'
replacement = 'for (uint256 i = 0; i < 1 && i < paths.length; i++) {'

[[mutants]]
name = "M22 every record file reads the first file content"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'address recorded = recordedDeployedAddress(paths[i], vm.readFile(paths[i]));'
replacement = 'address recorded = recordedDeployedAddress(paths[i], vm.readFile(paths[0]));'

[[mutants]]
name = "M23 match against the recorded address not the derived one"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'if (recorded == LibRainDeploy.zoltuAddress(released[j].creationCode)) {'
replacement = 'if (recorded == released[j].storedDeployedAddress) {'

[[mutants]]
name = "M24 only the first released suite is tried"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'for (uint256 j = 0; j < released.length; j++) {'
replacement = 'for (uint256 j = 0; j < 1 && j < released.length; j++) {'

[[mutants]]
name = "M25 a match never marks the file declared"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
                    declared = true;
'''
replacement = '''
                    declared = false;
'''

[[mutants]]
name = "M26 undeclared file names the first path"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'revert FrozenSnapshotNotReleased(paths[i]);'
replacement = 'revert FrozenSnapshotNotReleased(paths[0]);'

[[mutants]]
name = "M27 an empty released declaration passes"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'function checkFrozenSnapshotsReleased(string[] memory paths, DeploySuite[] memory released) internal view {'
replacement = '''function checkFrozenSnapshotsReleased(string[] memory paths, DeploySuite[] memory released) internal view {
        if (released.length == 0) {
            return;
        }'''

[[mutants]]
name = "M28 an empty record reverts"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'function checkFrozenSnapshotsReleased(string[] memory paths, DeploySuite[] memory released) internal view {'
replacement = '''function checkFrozenSnapshotsReleased(string[] memory paths, DeploySuite[] memory released) internal view {
        if (paths.length == 0) {
            revert FrozenSnapshotNotReleased("");
        }'''

[[mutants]]
name = "M29 record files are walked last to first"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
        for (uint256 i = 0; i < paths.length; i++) {
            address recorded = recordedDeployedAddress(paths[i], vm.readFile(paths[i]));
'''
replacement = '''
        for (uint256 k = 0; k < paths.length; k++) {
            uint256 i = paths.length - 1 - k;
            address recorded = recordedDeployedAddress(paths[i], vm.readFile(paths[i]));
'''

[[mutants]]
name = "M30 internal consistency subject is the released suites only"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'DeploySuite[] memory suites = allSuites();'
replacement = 'DeploySuite[] memory suites = releasedSuites();'

[[mutants]]
name = "M31 only the first suite is checked for internal consistency"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = 'for (uint256 i = 0; i < suites.length; i++) {'
replacement = 'for (uint256 i = 0; i < 1 && i < suites.length; i++) {'

[[mutants]]
name = "M32 source anchor test body emptied"
file = "src/abstract/RainDeployVerifySnapshotBase.sol"
target = '''
        checkCandidatesAnchoredToSource();
'''
replacement = '''
        assert(true);
'''
