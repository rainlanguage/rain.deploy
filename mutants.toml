[[mutants]]
name = "M28 guard skipped for a delegation designator"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.code.length != 23 && actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"

[[mutants]]
