[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (test\w+)\('
timeout-secs = 1800

# -------------------------------------------- LibAddressRegistry.resolve

[[mutants]]
name = "M23 codehash read from address(this)"
file = "src/lib/LibAddressRegistry.sol"
target = "bytes32 actualCodeHash = LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.codehash;"
replacement = "bytes32 actualCodeHash = address(this).codehash;"

[[mutants]]
name = "M24a codehash guard inverted"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (actualCodeHash == LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"

[[mutants]]
name = "M24b codehash guard deleted"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (false) {"

[[mutants]]
name = "M25 error args swapped"
file = "src/lib/LibAddressRegistry.sol"
target = """
            revert UnexpectedAddressRegistryCodeHash(
                LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH, actualCodeHash
            );
"""
replacement = """
            revert UnexpectedAddressRegistryCodeHash(
                actualCodeHash, LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH
            );
"""

[[mutants]]
name = "M26 guard skipped for an empty account"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.code.length != 0 && actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"

[[mutants]]
name = "M27 guard compares code length only"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.code.length == 0) {"

[[mutants]]
name = "M28 guard skipped for a delegation designator"
file = "src/lib/LibAddressRegistry.sol"
target = "if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"
replacement = "if (LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.code.length != 23 && actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {"

[[mutants]]
name = "M29a get called with keccak of name"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(keccak256(abi.encode(name)));"

[[mutants]]
name = "M29b resolve returns zero without calling"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "return address(0);"

[[mutants]]
name = "M30 NameNotRegistered swallowed into zero"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "try IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name) returns (address a) { return a; } catch { return address(0); }"

[[mutants]]
name = "M31 resolve answers the first binding it ever saw"
file = "src/lib/LibAddressRegistry.sol"
target = "return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);"
replacement = "address cached; assembly { cached := tload(name) } if (cached != address(0)) { return cached; } address fresh = IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name); assembly { tstore(name, fresh) } return fresh;"

[[mutants]]
name = "M37 registry called before the codehash check"
file = "src/lib/LibAddressRegistry.sol"
target = """
        bytes32 actualCodeHash = LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.codehash;
        if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {
            revert UnexpectedAddressRegistryCodeHash(
                LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH, actualCodeHash
            );
        }
        return IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);
"""
replacement = """
        address a = IAddressRegistryV1(LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS).get(name);
        bytes32 actualCodeHash = LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS.codehash;
        if (actualCodeHash != LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH) {
            revert UnexpectedAddressRegistryCodeHash(
                LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH, actualCodeHash
            );
        }
        return a;
"""

# ---------------------------------------------------- creation-code pin
# These two target a concrete file but are deliberately run under check.sh:
# the behaviour under probe IS the pin (root constant is part of creation code,
# and the lib and concrete must agree on one deployed address and code hash),
# which only the pin tests carry. check-nopin.sh excludes exactly those.

[[mutants]]
name = "M15pin root constant changed (creation code moves)"
file = "src/concrete/AddressRegistry.sol"
target = "0x0b300013CD54a8F1aC40981f80FaaA18b8Cc1E4c"
replacement = "0x0b300013Cd54a8f1aC40981f80FAAA18b8cc1e4D"

[[mutants]]
name = "M32 storage layout changed without changing behaviour"
file = "src/concrete/AddressRegistry.sol"
target = "mapping(bytes32 name => address account) internal sAddresses;"
replacement = "uint256 private sPad;\n\n    mapping(bytes32 name => address account) internal sAddresses;"
