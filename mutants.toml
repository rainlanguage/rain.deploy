target = "            total += released[i].length;"
replacement = "            total += 1;"

[[mutants]]
name = "M05 offset never advances"
file = "src/lib/LibReleasedSuites.sol"
target = "            offset += released[i].length;"
replacement = "            offset += 0;"

[[mutants]]
name = "M06 inner copy skips the last entry"
file = "src/lib/LibReleasedSuites.sol"
target = "j < released[i].length; j++"
replacement = "j + 1 < released[i].length; j++"

[[mutants]]
name = "M07 copy loop stops after the first lib"
file = "src/lib/LibReleasedSuites.sol"
target = '''        for (uint256 i = 0; i < released.length; i++) {
            for (uint256 j'''
replacement = '''        for (uint256 i = 0; i < 1; i++) {
            for (uint256 j'''

[[mutants]]
name = "M08 aggregate returns the first lib alone"
file = "src/lib/LibReleasedSuites.sol"
target = "        return suites;"
replacement = "        return released[0];"

[[mutants]]
name = "M09 address-registry released drops the 0_1_10 entry"
