[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (test\w+)\('
timeout-secs = 1800

[[mutants]]
name = "M01 releasedSuites returns nothing"
file = "src/abstract/RegistryDeploySuites.sol"
target = "        return LibReleasedSuites.releasedSuites();"
replacement = "        return new DeploySuite[](0);"

[[mutants]]
name = "M01b releasedSuites drops the last release"
file = "src/abstract/RegistryDeploySuites.sol"
target = "        return LibReleasedSuites.releasedSuites();"
replacement = '''        DeploySuite[] memory all = LibReleasedSuites.releasedSuites();
        DeploySuite[] memory some = new DeploySuite[](all.length - 1);
        for (uint256 i = 0; i < some.length; i++) {
            some[i] = all[i];
        }
        return some;'''

[[mutants]]
name = "M02a candidateSuites declares one candidate"
file = "src/abstract/RegistryDeploySuites.sol"
target = '''        DeployCandidate[] memory candidates = new DeployCandidate[](2);
        candidates[0] = addressRegistryCandidate();
        candidates[1] = migrationRegistryCandidate();'''
replacement = '''        DeployCandidate[] memory candidates = new DeployCandidate[](1);
        candidates[0] = addressRegistryCandidate();'''

[[mutants]]
name = "M02b candidateSuites declares a third duplicate candidate"
file = "src/abstract/RegistryDeploySuites.sol"
target = '''        DeployCandidate[] memory candidates = new DeployCandidate[](2);
        candidates[0] = addressRegistryCandidate();
        candidates[1] = migrationRegistryCandidate();'''
replacement = '''        DeployCandidate[] memory candidates = new DeployCandidate[](3);
        candidates[0] = addressRegistryCandidate();
        candidates[1] = migrationRegistryCandidate();
        candidates[2] = migrationRegistryCandidate();'''

[[mutants]]
name = "M03 candidateSuites slot zero is the migration candidate"
file = "src/abstract/RegistryDeploySuites.sol"
target = "        candidates[0] = addressRegistryCandidate();"
replacement = "        candidates[0] = migrationRegistryCandidate();"

[[mutants]]
name = "M04 candidateSuites slot one is the address candidate"
file = "src/abstract/RegistryDeploySuites.sol"
target = "        candidates[1] = migrationRegistryCandidate();"
replacement = "        candidates[1] = addressRegistryCandidate();"

[[mutants]]
name = "M05a address candidate key is the migration key"
file = "src/abstract/RegistryDeploySuites.sol"
target = '                suite: "address-registry",'
replacement = '                suite: "migration-registry",'

[[mutants]]
name = "M05b address candidate key collides with a released key"
file = "src/abstract/RegistryDeploySuites.sol"
target = '                suite: "address-registry",'
replacement = '                suite: "address-registry@0_1_10",'

[[mutants]]
name = "M06 address candidate records source creation code not the snapshot"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                creationCode: ADDRESS_REGISTRY_CREATION_CODE_CANDIDATE,"
replacement = "                creationCode: type(AddressRegistry).creationCode,"

[[mutants]]
name = "M07 address candidate stored address is zero"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedDeployedAddress: LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS,"
replacement = "                storedDeployedAddress: address(0),"

[[mutants]]
name = "M08 address candidate stored code hash is zero"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedBytecodeHash: LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH,"
replacement = "                storedBytecodeHash: bytes32(0),"

[[mutants]]
name = "M09 address candidate stored runtime code is its creation code"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedRuntimeCode: ADDRESS_REGISTRY_RUNTIME_CODE_CANDIDATE,"
replacement = "                storedRuntimeCode: ADDRESS_REGISTRY_CREATION_CODE_CANDIDATE,"

[[mutants]]
name = "M10 address candidate artifact path names the other contract"
file = "src/abstract/RegistryDeploySuites.sol"
target = '                artifactPath: "src/concrete/AddressRegistry.sol:AddressRegistry",'
replacement = '                artifactPath: "src/concrete/AddressRegistry.sol:MigrationRegistry",'

[[mutants]]
name = "M11 address candidate declares a dependency"
file = "src/abstract/RegistryDeploySuites.sol"
target = '''                artifactPath: "src/concrete/AddressRegistry.sol:AddressRegistry",
                dependencies: new address[](0)'''
replacement = '''                artifactPath: "src/concrete/AddressRegistry.sol:AddressRegistry",
                dependencies: new address[](1)'''

[[mutants]]
name = "M12 address candidate source anchor is the other contract"
file = "src/abstract/RegistryDeploySuites.sol"
target = "            sourceCreationCode: type(AddressRegistry).creationCode"
replacement = "            sourceCreationCode: type(MigrationRegistry).creationCode"

[[mutants]]
name = "M13 migration candidate key is the address key"
file = "src/abstract/RegistryDeploySuites.sol"
target = '                suite: "migration-registry",'
replacement = '                suite: "address-registry",'

[[mutants]]
name = "M14 migration candidate records source creation code not the snapshot"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                creationCode: MIGRATION_REGISTRY_CREATION_CODE_CANDIDATE,"
replacement = "                creationCode: type(MigrationRegistry).creationCode,"

[[mutants]]
name = "M15 migration candidate stored address is the address registry pin"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedDeployedAddress: LibMigrationRegistryDeploy.MIGRATION_REGISTRY_DEPLOYED_ADDRESS,"
replacement = "                storedDeployedAddress: LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_ADDRESS,"

[[mutants]]
name = "M16 migration candidate stored code hash is the address registry pin"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedBytecodeHash: LibMigrationRegistryDeploy.MIGRATION_REGISTRY_DEPLOYED_CODEHASH,"
replacement = "                storedBytecodeHash: LibAddressRegistryDeploy.ADDRESS_REGISTRY_DEPLOYED_CODEHASH,"

[[mutants]]
name = "M17 migration candidate stored runtime code is the other snapshot"
file = "src/abstract/RegistryDeploySuites.sol"
target = "                storedRuntimeCode: MIGRATION_REGISTRY_RUNTIME_CODE_CANDIDATE,"
replacement = "                storedRuntimeCode: ADDRESS_REGISTRY_RUNTIME_CODE_CANDIDATE,"

[[mutants]]
name = "M18 migration candidate artifact path names the other contract"
file = "src/abstract/RegistryDeploySuites.sol"
target = '                artifactPath: "src/concrete/MigrationRegistry.sol:MigrationRegistry",'
replacement = '                artifactPath: "src/concrete/MigrationRegistry.sol:AddressRegistry",'

[[mutants]]
name = "M19 migration candidate declares a dependency"
file = "src/abstract/RegistryDeploySuites.sol"
target = '''                artifactPath: "src/concrete/MigrationRegistry.sol:MigrationRegistry",
                dependencies: new address[](0)'''
replacement = '''                artifactPath: "src/concrete/MigrationRegistry.sol:MigrationRegistry",
                dependencies: new address[](1)'''

[[mutants]]
name = "M20 migration candidate source anchor is the other contract"
file = "src/abstract/RegistryDeploySuites.sol"
target = "            sourceCreationCode: type(MigrationRegistry).creationCode"
replacement = "            sourceCreationCode: type(AddressRegistry).creationCode"

[[mutants]]
name = "M21 Deploy overrides deployNetworks to one chain"
file = "script/Deploy.sol"
target = "contract Deploy is RegistryDeploySuites, RainDeployBroadcast {}"
replacement = '''contract Deploy is RegistryDeploySuites, RainDeployBroadcast {
    function deployNetworks() internal view override returns (string[] memory) {
        string[] memory networks = new string[](1);
        networks[0] = "ethereum";
        return networks;
    }
}'''

[[mutants]]
name = "M22 CreditHyperCore reads the amount name for the key"
file = "script/CreditHyperCore.sol"
target = '        address deployer = vm.rememberKey(vm.envUint("DEPLOYMENT_KEY"));'
replacement = '        address deployer = vm.rememberKey(vm.envUint("HYPERCORE_CREDIT_WEI"));'

[[mutants]]
name = "M23 CreditHyperCore defaults the amount to zero"
file = "script/CreditHyperCore.sol"
target = '        uint256 amount = vm.envUint("HYPERCORE_CREDIT_WEI");'
replacement = '        uint256 amount = vm.envOr("HYPERCORE_CREDIT_WEI", uint256(0));'

[[mutants]]
name = "M24 CreditHyperCore credits without forking hyperevm"
file = "script/CreditHyperCore.sol"
target = "        LibHyperCore.creditCoreOnHyperEvm(vm, deployer, amount);"
replacement = "        LibHyperCore.creditCore(vm, deployer, amount);"
