[suite]
root = "."
command = ["sh", "check.sh"]
proof = '(\d+) passed; (\d+) failed'
fail-pattern = '\[FAIL.*?\] (test\w+)\('
timeout-secs = 900

[[mutants]]
name = "M52 DEPENDENCIES comment text changed"
file = "src/lib/LibRainDeploySnapshot.sol"
target = '"/// @dev The addresses that MUST already have code on a network before\n"'
replacement = '"/// @dev The addresses that must already have code on a network before\n"'

[[mutants]]
name = "M53 writeSnapshot does not etch the Zoltu factory"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        LibRainDeploy.etchZoltuFactory(vm);\n"
replacement = ""

[[mutants]]
name = "M54 writeSnapshot deploys with CREATE instead of Zoltu"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        address deployed = LibRainDeploy.deployZoltu(creationCode);"
replacement = """
        address deployed;
        assembly ("memory-safe") {
            deployed := create(0, add(creationCode, 0x20), mload(creationCode))
        }"""

[[mutants]]
name = "M55 BYTECODE_HASH instance is address(this) not deployed"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "vm, deployed, dir, contractName, spdxLicenseIdentifier, copyrightText, constants"
replacement = "vm, address(this), dir, contractName, spdxLicenseIdentifier, copyrightText, constants"

[[mutants]]
name = "M56 writeSnapshot writes into CANDIDATE not dir"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "vm, deployed, dir, contractName, spdxLicenseIdentifier, copyrightText, constants"
replacement = "vm, deployed, CANDIDATE, contractName, spdxLicenseIdentifier, copyrightText, constants"

[[mutants]]
name = "M57 writeSnapshot swaps spdx and copyright"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "vm, deployed, dir, contractName, spdxLicenseIdentifier, copyrightText, constants"
replacement = "vm, deployed, dir, contractName, copyrightText, spdxLicenseIdentifier, constants"

[[mutants]]
name = "M58 writeSnapshot body is empty"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "vm, deployed, dir, contractName, spdxLicenseIdentifier, copyrightText, constants"
replacement = "vm, deployed, dir, contractName, spdxLicenseIdentifier, copyrightText, \"\""

[[mutants]]
name = "M59 writeSnapshot returns the CANDIDATE path"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        return pathForSnapshot(dir, contractName);"
replacement = "        return pathForSnapshot(CANDIDATE, contractName);"

[[mutants]]
name = "M60 writeSnapshot(5) swaps the org defaults"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "vm, dir, contractName, RAIN_SPDX_LICENSE_IDENTIFIER, RAIN_COPYRIGHT_TEXT, creationCode, dependencies"
replacement = "vm, dir, contractName, RAIN_COPYRIGHT_TEXT, RAIN_SPDX_LICENSE_IDENTIFIER, creationCode, dependencies"

[[mutants]]
name = "M61 aliasImportBlock swaps the two aliases"
file = "src/lib/LibRainDeploySnapshot.sol"
target = """
            "_ADDR,\\n    BYTECODE_HASH as ",
            constantPrefix,
            "_HASH\\n} from \\"../generated/","""
replacement = """
            "_HASH,\\n    BYTECODE_HASH as ",
            constantPrefix,
            "_ADDR\\n} from \\"../generated/","""

[[mutants]]
name = "M62 aliasImportBlock import path is ./generated"
file = "src/lib/LibRainDeploySnapshot.sol"
target = '"_HASH\n} from \"../generated/",'
replacement = '"_HASH\n} from \"./generated/",'

[[mutants]]
name = "M63 aliasImportBlock ends with a single newline"
file = "src/lib/LibRainDeploySnapshot.sol"
target = """
            contractName,
            ".sol\\";\\n\\n"
        );
    }

    /// The library block of a generated alias lib."""
replacement = """
            contractName,
            ".sol\\";\\n"
        );
    }

    /// The library block of a generated alias lib."""

