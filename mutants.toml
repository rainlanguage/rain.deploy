[[mutants]]
name = "M72 tagForRecordPath takes the last component"
file = "src/lib/LibRainDeploySnapshot.sol"
target = "        return components[components.length - 2];"
replacement = "        return components[components.length - 1];"

[[mutants]]
name = "M73 contractForRecordPath keeps .sol"
file = "src/lib/LibRainDeploySnapshot.sol"
target = '        return vm.replace(components[components.length - 1], ".sol", "");'
replacement = '        return components[components.length - 1];'

[[mutants]]
name = "M74 releasedConstantPrefix is tag first"
file = "src/lib/LibRainDeploySnapshot.sol"
