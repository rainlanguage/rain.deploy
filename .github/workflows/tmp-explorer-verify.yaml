name: tmp explorer verify
# Temporary, branch-only. Exercises the `rainix-manual-sol-verify` reusable in
# exactly the shape `manual-sol-verify.yaml` calls it, over both registries and
# every supported explorer. Never broadcasts.
on: push
jobs:
  address-registry:
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-verify.yaml@2026-08-16-manual-sol-verify
    with:
      contract: src/concrete/AddressRegistry.sol:AddressRegistry
      address: '0x25aC2b82915f191dbE64e65BAeDDD68b97b68fe1'
      networks: arbitrum base base-sepolia flare polygon
    secrets: inherit
  migration-registry:
    # Serialised behind the first, so the two do not share the one multichain
    # key's per-second budget between them.
    needs: address-registry
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-verify.yaml@2026-08-16-manual-sol-verify
    with:
      contract: src/concrete/MigrationRegistry.sol:MigrationRegistry
      address: '0x6E3aE74aDCd6CF28A1b2F685D5E709ffE44D429D'
      networks: arbitrum base base-sepolia flare polygon
    secrets: inherit
